name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    # Tests that touch login and caps run against this.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: spendmux_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/spendmux_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/react/package-lock.json
      - name: Check formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './frontend/*'))"
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -coverprofile=coverage.out ./...
      - name: Check Go vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...
      - name: Run Go security analysis
        run: go run github.com/securego/gosec/v2/cmd/gosec@v2.29.0 -quiet ./...
      - name: Build frontend
        working-directory: frontend/react
        run: npm ci && npm run build
      - name: Audit frontend dependencies
        working-directory: frontend/react
        run: npm audit --audit-level=high
      - name: Build container
        run: docker build -t spendmux:ci .
